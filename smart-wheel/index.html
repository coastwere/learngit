<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>聪明程度转盘</title><style>body{text-align:center;background:#f5f0e5;font-family:PingFang SC,Arial}canvas{max-width:90vw;background:#fff;border-radius:50%;box-shadow:0 8px 30px #999}button{padding:12px 30px;font-size:20px;border-radius:20px;background:#303c91;color:white;border:0}#r{font-size:28px;font-weight:bold}</style><h1>聪明程度转盘</h1><canvas id='c' width='700' height='700'></canvas><div id='r'>准备好了吗？</div><button onclick='spin()'>转一下</button><script>let c=document.getElementById('c'),x=c.getContext('2d'),a=0,b=false;let n=['大笨蛋','很笨','笨','有点笨','普通','偏聪明','比较聪明','聪明','很聪明','天才'];let col=['#8d6e63','#a1887f','#bcaaa4','#ddd','#ffe082','#a5d6a7','#81c784','#4db6ac','#64b5f6','#ba68c8'];let start=0;function draw(){x.clearRect(0,0,700,700);x.save();x.translate(350,350);x.rotate(a);for(let i=0;i<10;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,280,-Math.PI/2+i*Math.PI/10,-Math.PI/2+(i+1)*Math.PI/10);x.fillStyle=col[i];x.fill();x.stroke();x.save();x.rotate(-Math.PI/2+(i+.5)*Math.PI/10);x.translate(190,0);x.rotate(Math.PI/2);x.font='bold 22px sans-serif';x.fillStyle='#222';x.fillText(n[i],-35,0);x.restore()}x.restore();x.fillStyle='red';x.beginPath();x.moveTo(350,15);x.lineTo(330,60);x.lineTo(370,60);x.fill()}draw();function spin(){if(b)return;b=true;let s=a,t=a+Math.PI*2*(8+Math.random()*3)+Math.random()*Math.PI*2,z=0;function f(){z+=16;let p=Math.min(z/5200,1),e=1-Math.pow(1-p,4);a=s+(t-s)*e;draw();if(p<1)requestAnimationFrame(f);else{b=false;let deg=((a*180/Math.PI)%360+360)%360;let score=Math.round(deg/360*100)%101;let idx=Math.min(9,Math.floor(score/10));document.getElementById('r').innerText='结果：'+n[idx]+'，刻度 '+score+'格'}}requestAnimationFrame(f)}</script></html>
